[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-agent"
version = "0.1.0"
description = "Invoice processing agent (PS-1) - backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "anthropic>=1.8",
    "pypdfium2>=5",
    "Pillow>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
init-db = "app.db.init_db:main"
reset-db = "app.db.reset:main"
llm-probe = "app.llm.probe:main"
extract = "app.extraction.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-m 'not live'"
markers = [
    "live: calls the real Anthropic API (costs money). Skipped by default and when no key is set; run with `pytest -m live`.",
]
