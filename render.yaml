# Render Blueprint for the backend API on Render's FREE instance type (see DEPLOY.md). No secrets in this file: every secret is
# `sync: false` and is set in the Render dashboard.
#
# Free tier trade-off (accepted): no persistent disk, no Shell, no one-off jobs. The filesystem is ephemeral: everything the
# running service writes (database rows, run folders, uploads, PO drafts) is LOST when it spins down (15 minutes without traffic),
# restarts or redeploys. The demo database is therefore created by the BUILD command, whose output every start of the service
# begins from: each spin-up, restart and redeploy starts from a fresh demo dataset. The server itself (`serve`) still never
# creates, resets or migrates a database; it refuses to start if the database is missing.
services:
  - type: web
    name: invoice-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -e . && python -m app.db.reset --demo
    startCommand: python -m app.api.serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SERVE_MODE
        value: live                    # real, paid extraction; `offline` runs without any model
      - key: DATA_DIR
        value: data/render             # relative to the repository root, where both the build and the start command run; part of the build output
      - key: COST_CEILING_PER_SESSION_USD
        value: "1.00"                  # per server process; resets on every restart, spin-up or deploy (about 35-50 invoices)
      - key: ANTHROPIC_API_KEY
        sync: false                    # set in the dashboard
      - key: ACCESS_TOKEN
        sync: false                    # set in the dashboard; the frontend asks for it once per browser tab
      - key: API_CORS_ORIGINS
        sync: false                    # the Vercel URL, set after the frontend exists (comma-separate several)
